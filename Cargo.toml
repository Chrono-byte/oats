[workspace]
resolver = "2"
members = ["crates/oatsc", "crates/runtime", "crates/std", "crates/toasty"]

[workspace.lints.rust]
# Compiler development often needs unsafe code for FFI and LLVM bindings
unsafe_code = "allow"

[workspace.lints.clippy]
# Core correctness - catch bugs early
correctness = { level = "deny", priority = 1 }
suspicious = { level = "deny", priority = 1 }

# Performance - critical for compilers
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# Complexity - keep code maintainable
complexity = { level = "warn", priority = 1 }

# Style - compilers often use certain patterns
enum_glob_use = "warn"
too_many_arguments = "allow"  # AST nodes often have many fields
missing_docs_in_private_items = "allow"  # Initial development

# Match patterns - allow some flexibility for AST/IR processing
single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
collapsible_match = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
needless_bool = "deny"

# Allowances for compiler development
indexing_slicing = "warn"  # Common in codegen
min_ident_chars = "allow"  # AST/IR often uses short names
doc_markdown = "warn"
type_complexity = "allow"     # Complex AST types are common
cognitive_complexity = "warn" # Still warn about overly complex functions
no_mangle_with_rust_abi = "allow"  # Required for FFI exports

# Disable overly strict lints that don't apply well to compilers
# pedantic = { level = "warn", priority = 1 }  # Enable selectively
# nursery = { level = "warn", priority = 2 }  # Enable selectively