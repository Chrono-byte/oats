[package]
name = "toasty"
version = "0.1.1"
edition = "2024"
description = "Toasty CLI for Oats compiler"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "3.0"
serde = { version = "1.0.218", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"
thiserror = "2.0"

atty = "0.2"
petgraph = "0.8"
ureq = { version = "3.1", features = ["json"] }
dirs = "6.0"
sha2 = "0.10"
pathdiff = "0.2"
flate2 = "1.0"
tar = "0.4"
regex = "1.10"

[dependencies.oatsc]
path = "../oatsc"

[dependencies.oxc_ast]
version = "0.105.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.5"

[[bin]]
name = "toasty"
path = "src/main.rs"

[lints]
workspace = true
